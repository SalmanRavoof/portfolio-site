<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="630" fill="#f7f8f9"/>
  <!-- hard offset shadow -->
  <rect x="84" y="84" width="1060" height="478" rx="22" fill="#1a1a1a"/>
  <!-- card -->
  <rect x="70" y="70" width="1060" height="478" rx="22" fill="#fdeeee" stroke="#1a1a1a" stroke-width="3"/>
  <!-- kicker -->
  <text x="140" y="186" fill="#b32222" font-size="26" letter-spacing="4" font-family="'JetBrains Mono', 'Consolas', monospace" font-weight="500">TECHNICAL CONTENT WRITER FOR HIRE</text>
  <!-- headline -->
  <text x="138" y="300" fill="#16181d" font-size="72" font-weight="700" letter-spacing="-2">Hard technical topics,</text>
  <text x="138" y="384" fill="#16181d" font-size="72" font-weight="700" letter-spacing="-2">written so people</text>
  <text x="138" y="468" fill="#16181d" font-size="72" font-weight="700" letter-spacing="-2">actually read them.</text>
  <!-- brand + url -->
  <text x="140" y="520" fill="#16181d" font-size="30" font-weight="700">salman ravoof<tspan fill="#dd3333">.</tspan></text>
  <text x="1060" y="520" fill="#6d7482" font-size="24" text-anchor="end" font-family="'JetBrains Mono', 'Consolas', monospace">portfolio.salmanravoof.com</text>
